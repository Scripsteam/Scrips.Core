message GetResourceByIdRequest {
  string id = 1;
}
// One device. roomId is the dbo.PracticeExamRooms id the device is allocated to; empty = no room.
// technicianId is the dbo.AddStaff id of the technician assigned to it; empty = none.
message GetResourceByIdResponse {
  string id = 1;
  string name = 2;
  string type = 3;
  string practiceId = 4;
  string roomId = 5;
  bool isArchived = 6;
  string subtype = 7;
  string technicianId = 8;   // dbo.AddStaff id of the assigned technician; empty = none
}
// Comma-separated ids, same convention as GetRoomsRequest.roomIds.
message GetResourcesRequest {
  string resourceIds = 1;
}
message GetResourcesResponse {
  repeated GetResourceByIdResponse resources = 1;
}

// Per-device calendar settings for a set of devices (Practice.ResourceCalendarSettings). A device
// with no settings row is simply absent: the caller defaults its overbooking to 0. At most 500 ids.
message GetResourceOverbookCalendarSettingsBatchRequest {
  repeated string resourceIds = 1;
}
message ResourceOverbookCalendarSettingItem {
  string resourceId = 1;
  int32 maxOverBookingsPerSlot = 2;
  int32 defaultCalendarIncrements = 3;
  int32 availableSlotsToPatient = 4;
  int32 availableSlotsToPractice = 5;
}
message GetResourceOverbookCalendarSettingsBatchResponse {
  repeated ResourceOverbookCalendarSettingItem settings = 1;
}

// A device's products (Practice.ResourceAppointmentProfiles): "duration is a product, not a setting".
// NotFound for an unknown device; an archived device still answers (a booked appointment may need
// its profile's duration). includeArchived=false returns live profiles only.
message GetResourceAppointmentProfilesRequest {
  string resourceId = 1;
  bool includeArchived = 2;
}
message ResourceAppointmentProfile {
  string id = 1;
  string resourceId = 2;
  string profileName = 3;
  int32 minutesDuration = 4;
  string color = 5;              // empty = none
  string appointmentTypeId = 6;  // empty = none
  bool isDefault = 7;
  bool inAppBooking = 8;
  bool isArchived = 9;
  string billingProfileId = 10;  // empty = none; Scrips.Billing dbo.BillingProfile.Id the device booking prices with by default (PROD-2154)
  string serviceId = 11;         // empty = none; Scrips.Billing dbo.Service.Id this product IS: the priced service whose
                                 // ServiceLocationFee gives the product its price (PROD-2165, "a product is a name, a
                                 // duration and a price"). Takes precedence over billingProfileId, which stays and keeps
                                 // working: a service is one priced line, a billing profile is a bundle.
}
message GetResourceAppointmentProfilesResponse {
  repeated ResourceAppointmentProfile profiles = 1;
}
