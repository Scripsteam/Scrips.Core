syntax = "proto3";
option csharp_namespace ="Scrips.Core.GrpcApiClients";
import "Common.proto";
package Provider;

service ProviderManagement{
  //get the provider reason for visit for appointment
  rpc GetProviderRFV (GetProviderRFVRequest) returns (GetProviderRFVResponse);
  rpc GetProviderRFVs (GetProviderRFVsRequest) returns (GetProviderRFVsResponse);
  rpc GetPractitionerLicenceNo (GetPractitionerLicenceNoRequest) returns (GetPractitionerLicenceNoResponse);
  rpc GetPractitionerLicenceNoByIds (GetPractitionerLicenceNoByIdsRequest) returns (GetPractitionerLicenceNoByIdsResponse);
  rpc GetSpecialityNameByIds (Common.Ids) returns (SpecialityNamesResponse);
  // WhatsApp front desk (21 Nov 2026): the PUBLIC professional profile of up to 20 practitioners, as short display lines the practitioner wrote or entered in
  // Professional Details and Educational Details (bio, languages, qualifications, residencies, fellowships, achievements, work experience). Read-only. Never
  // licence number, date of birth, email, phone or signature. An unknown id is simply absent from the answer. Org-scoped: only practitioners with an
  // active role in organization_id are returned; a missing or invalid organization_id returns nothing.
  rpc GetPractitionerPublicProfiles (GetPractitionerPublicProfilesRequest) returns (GetPractitionerPublicProfilesResponse);
}

message SpecialityName
{
	string id = 1;
	string name = 2;
}

message SpecialityNamesResponse
{
	repeated SpecialityName values=1;
}

message CheckProviderOnboardingUserIdRequest{
    string id=1;
}

message CheckProviderOnboardingUserIdResponse{
    bool isOnboarding=1;
}

message GetProviderRFVRequest{
 string code=1;
}
message GetProviderRFVResponse{
 string code=1;
 string display=2;
 string definition=3;
 string id=4;
}
message GetProviderRFVsRequest{
	repeated string codes=1;
}
message GetProviderRFVsResponse{
	repeated GetProviderRFVResponse providerRFVList=1;
}
message GetPractitionerLicenceNoRequest{
	string providerId=1;
}
message GetPractitionerLicenceNoResponse{
	string licenceNo=1;
	string licenceAuthorityId=2;
	string expirationDate=3;
}

message GetPractitionerLicenceNoByIdsRequest{
	repeated string providerIds=1;
}
message GetPractitionerLicenceNoByIdResponse{
	string providerId=1;
	string licenceNo=2;
	string expirationDate=3;
}
message GetPractitionerLicenceNoByIdsResponse{
	repeated GetPractitionerLicenceNoByIdResponse providers=1;
}

message GetPractitionerPublicProfilesRequest {
	repeated string practitioner_ids = 1;   // at most 20 are read; non-guid values are ignored
	string organization_id = 2;             // required: the caller's organisation; a practitioner outside it is left out
}
// Every list holds at most 5 short lines (each at most 160 characters); bio at most 600 characters. Empty = nothing on file.
message PractitionerPublicProfile {
	string practitioner_id = 1;
	string bio = 2;                          // Professional Details, "professional statement"
	repeated string languages = 3;
	repeated string qualifications = 4;      // e.g. "MBBS, Cairo University (2010)"
	repeated string residencies = 5;
	repeated string fellowships = 6;
	repeated string achievements = 7;
	repeated string work_experiences = 8;
}
message GetPractitionerPublicProfilesResponse {
	repeated PractitionerPublicProfile profiles = 1;
}
